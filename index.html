<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>connpass QR 受付</title>
  <link rel="stylesheet" href="./style.css?v=6">
  <script defer src="./app.js?v=6"></script>
</head>
<body>
  <main>
    <header>
      <span class="badge">イベント主催者向け</span>
      <h1>connpass QR 受付</h1>
      <p>参加者の受付票を読み取り、connpass で出席を登録します。</p>
    </header>
    <section class="card" aria-labelledby="setup-title">
      <h2 id="setup-title">1. connpass にログイン</h2>
      <p>このブラウザで、イベント管理者としてログインしてください。受付前の準備です。</p>
    </section>
    <section class="card" aria-labelledby="scan-title">
      <h2 id="scan-title">2. 受付票をスキャン</h2>
      <p>このタブで受付票をスキャンすると、connpass が別タブで開きます。出席結果を確認したら、このタブに戻って次の受付票をスキャンしてください。</p>
      <form id="scan-form">
        <label for="url">QRコードリーダーの入力欄</label>
        <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus required>
      </form>
      <p id="status" role="status" aria-live="polite">受付票のQRコードを読み取ってください。</p>
    </section>
    <footer><a href="https://help.connpass.com/topics/event-attendee-qr-checkin" target="_blank" rel="noopener noreferrer">connpass 公式の受付ガイド ↗</a></footer>
  </main>
</body>
</html>
